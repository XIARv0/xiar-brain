[package]
name = "xiar-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
redb = "3"
thiserror = "2"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
argon2 = "0.5"
serde_json = "1"
moka = { version = "0.12", features = ["sync"] }
uuid = { version = "1", features = ["v5"] }
xiar-qdrant-edge = { path = "../../vendor/xiar-qdrant-edge" }

[dev-dependencies]
tempfile = "3"
