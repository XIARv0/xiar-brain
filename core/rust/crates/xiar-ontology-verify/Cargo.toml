[package]
name = "xiar-ontology-verify"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "xiar-ontology-verify"
path = "src/main.rs"

[dependencies]
redb = "3"
serde_json = { version = "1", features = ["preserve_order"] }
xiar-owl = { path = "../xiar-owl" }
xiar-store = { path = "../xiar-store" }
xiar-core = { path = "../xiar-core" }
xiar-ontology = { path = "../xiar-ontology" }
xiar-memory = { path = "../xiar-memory" }
tempfile = "3"
