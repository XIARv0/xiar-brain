[package]
name = "xiar-ontology-recall"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "xiar-ontology-recall"
path = "src/main.rs"

[dependencies]
xiar-memory = { path = "../xiar-memory" }
xiar-ontology = { path = "../xiar-ontology" }
xiar-owl = { path = "../xiar-owl" }
xiar-prompts = { path = "../xiar-prompts" }
xiar-store = { path = "../xiar-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
