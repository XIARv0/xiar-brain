[package]
name = "xiar-memory-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Tenant-scoped MIRIX Semantic memory API for Hermes (via integrations/hermes-xiar). X-Business-Id mandatory.
[features]
# ONLY for the barrier tests: lets a test force the stop state. Never enabled by a release or production build.
test-hooks = []

[dependencies]
xiar-memory = { path = "../xiar-memory" }
xiar-audit = { path = "../xiar-audit" }
xiar-ontology = { path = "../xiar-ontology" }
xiar-prompts = { path = "../xiar-prompts" }
xiar-store = { path = "../xiar-store" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

xiar-engine-http = { path = "../xiar-engine-http" }
xiar-llm = { path = "../xiar-llm" }
sha2 = "0.10"
jiff = "0.2"
regex = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "api"
required-features = ["test-hooks"]

[[test]]
name = "hybrid_api"
required-features = ["test-hooks"]

[[test]]
name = "scope_api"
required-features = ["test-hooks"]

[[test]]
name = "autonomy_barrier"
required-features = ["test-hooks"]

