[package]
name = "xiar-ontology"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The ontology service as a library: scout, engineer and critic agents, versioned registry, promotion, query expansion.
[dependencies]
xiar-owl = { path = "../xiar-owl" }
xiar-llm = { path = "../xiar-llm" }
xiar-prompts = { path = "../xiar-prompts" }
xiar-store = { path = "../xiar-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
