# REUSE annotations for files that cannot (or should not) carry an in-file header:
# prompt files are sent to the LLM verbatim, mental-model notes are read back to agents verbatim,
# and JSON/text fixtures are parsed by tests.
version = 1

[[annotations]]
path = ["core/rust/prompts/mirix/**"]
precedence = "override"
SPDX-FileCopyrightText = ["Mirix-AI and MIRIX contributors", "2023 Letta authors"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["core/rust/vendor/xiar-qdrant-edge/**"]
precedence = "closest"
SPDX-FileCopyrightText = "Qdrant Solutions GmbH; modifications by XIAR contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["core/neural-brain/tokenizers/mistral-v0.1/**"]
precedence = "override"
SPDX-FileCopyrightText = "Mistral AI"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["core/rust/prompts/ontology/**", "core/rust/prompts/base/**", "Brain/Shared/mental-models/**",
        "core/rust/ontologies-example/**", "core/rust/crates/**/tests/golden/**", "core/neural-brain/bench/**",
        "docs/eval/**", "core/rust/Cargo.lock", "config/secrets.example/*.example", "integrations/hermes-xiar/tests/**"]
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2026 Donald Nadeau Jr. (SyberShot) <https://xiarv0.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["README.md", "docs/**", "config/secrets.example/README.md", "THIRD_PARTY_LICENSES.md", "NOTICE"]
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2026 Donald Nadeau Jr. (SyberShot) <https://xiarv0.com>"
SPDX-License-Identifier = "CC-BY-4.0"
